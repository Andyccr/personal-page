<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andy Chen · 个人页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #fcfcfc;
      color: #000;
      font-family: Montserrat, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 400;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 96px 24px 80px;
    }
    h1 {
      font-family: Lora, "Songti SC", "Noto Serif CJK SC", serif;
      font-weight: 400;
      font-size: 30px;
      margin: 0 0 8px;
    }
    p.sub {
      color: rgba(0, 0, 0, 0.45);
      margin: 0 0 48px;
      font-size: 15px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    li:last-child { border-bottom: none; }
    a {
      display: block;
      padding: 18px 0;
      color: #000;
      text-decoration: none;
    }
    a:hover { color: #1976d2; }
    .v-name {
      display: block;
      font-family: Lora, "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 19px;
    }
    .v-desc {
      display: block;
      color: rgba(0, 0, 0, 0.45);
      font-size: 14px;
      margin-top: 2px;
    }
    footer {
      margin-top: 56px;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <main>
    <h1>Andy Chen</h1>
    <p class="sub">个人页 · 五个版本</p>
    <ul>
      <li><a href="v1/"><span class="v-name">v1 · 问道</span><span class="v-desc">忠实于新博客「问道」的布局：左侧固定导航、白色面板与蓝色强调。</span></a></li>
      <li><a href="v2/"><span class="v-name">v2 · 一页纸</span><span class="v-desc">单列窄页，全衬线字体，像一张名片式的纸页。</span></a></li>
      <li><a href="v3/"><span class="v-name">v3 · 旧站</span><span class="v-desc">致敬旧博客：Arial、深蓝标题，带暗色切换。</span></a></li>
      <li><a href="v4/"><span class="v-name">v4 · 竖排</span><span class="v-desc">中文古典极简，竖排大字签名，黑白为主。</span></a></li>
      <li><a href="v5/"><span class="v-name">v5 · 终端</span><span class="v-desc">等宽字体的 whoami 输出，键值对形式。</span></a></li>
    </ul>
    <footer>© Andy Chen</footer>
  </main>
</body>
</html>
