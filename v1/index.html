<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>格理悟道 · Andy Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora&family=Montserrat&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #1976d2;
      --accent-dark: #145ca4;
      --text: #000;
      --muted: rgba(0, 0, 0, 0.45);
      --bg: #fcfcfc;
      --panel: #ffffff;
      --side-width: 25%;
      --font-ui: Montserrat, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-serif: Lora, "Songti SC", "Songti TC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    }
    * { box-sizing: border-box; }
    html { overflow-y: scroll; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.5;
      font-weight: 400;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dark); text-decoration: underline; text-underline-position: under; }
    h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 24px;
      margin: 0 0 18px;
      line-height: 1.4;
    }

    .side {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: var(--side-width);
      padding: 20px 0 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      font-family: var(--font-ui);
    }
    .nav-head {
      display: block;
      padding: 30px 28px 30px 20px;
      margin-bottom: 10px;
      color: var(--text);
      border-right: 2px solid transparent;
      transition: all 0.2s linear;
    }
    .nav-head:hover { text-decoration: none; border-right-color: rgba(25, 118, 210, 0.6); }
    .nav-title { font-size: 30px; line-height: 42px; font-weight: 400; }
    .nav-subtitle { margin-top: 8px; font-size: 18px; font-weight: 400; }
    .nav-list { flex-grow: 1; }
    .nav-link {
      display: block;
      font-size: 20px;
      margin-bottom: 10px;
      padding: 8px 28px 8px 30px;
      color: var(--text);
      border-right: 2px solid transparent;
      transition: all 0.2s linear;
    }
    .nav-link:hover {
      text-decoration: none;
      color: var(--accent-dark);
      border-right: 2px solid var(--accent);
      background: rgba(25, 118, 210, 0.02);
    }
    .nav-footer { padding: 20px 30px 0 20px; font-size: 12px; color: var(--muted); }

    .stream {
      padding-left: var(--side-width);
      padding-right: var(--side-width);
      width: 100%;
      min-height: 100vh;
    }
    .panel {
      width: 100%;
      min-height: 100vh;
      padding: 48px 40px 72px;
      background: var(--panel);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.12);
    }
    .panel-inner { max-width: 640px; margin: 0 auto; }
    section { margin-bottom: 56px; }
    .lead {
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.7;
      margin: 0 0 8px;
    }
    .now { color: var(--muted); font-size: 15px; }
    .dir-list { list-style: none; margin: 0; padding: 0; }
    .dir-list li {
      font-family: var(--font-serif);
      font-size: 18px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .dir-list li:last-child { border-bottom: none; }
    .proj { display: block; padding: 14px 0; color: var(--text); border-bottom: 1px solid rgba(0, 0, 0, 0.08); }
    .proj:last-of-type { border-bottom: none; }
    .proj:hover { text-decoration: none; }
    .proj-name { font-family: var(--font-serif); font-size: 18px; }
    .proj:hover .proj-name { color: var(--accent-dark); text-decoration: underline; text-decoration-color: var(--accent); text-underline-position: under; }
    .proj-desc { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
    .links a { margin-right: 20px; font-size: 16px; }
    .back { display: block; margin-top: 48px; font-size: 13px; }

    .topbar { display: none; }
    @media screen and (max-width: 700px) {
      .side { display: none; }
      .stream { padding: 0; }
      .panel { padding: 0 0 40px; box-shadow: none; }
      .topbar {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 16px;
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--panel);
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
        padding: 12px 20px;
        margin-bottom: 24px;
      }
      .topbar .brand { font-family: var(--font-serif); font-size: 20px; color: var(--text); margin-right: auto; }
      .topbar .brand:hover { text-decoration: none; }
      .topbar a { color: var(--text); font-size: 15px; }
      .topbar a:hover { color: var(--accent); }
      .panel-inner { padding: 0 20px; }
      .lead { font-size: 17px; }
    }
  </style>
</head>
<body>
  <aside class="side">
    <div class="nav-head">
      <div class="nav-title">格理悟道</div>
      <div class="nav-subtitle">Andy Chen</div>
    </div>
    <nav class="nav-list">
      <a class="nav-link" href="#about">关于</a>
      <a class="nav-link" href="#field">方向</a>
      <a class="nav-link" href="#projects">项目</a>
      <a class="nav-link" href="#links">链接</a>
    </nav>
    <div class="nav-footer">© Andy Chen</div>
  </aside>

  <main class="stream">
    <div class="panel">
      <div class="topbar">
        <a class="brand" href="#">格理悟道</a>
        <a href="#about">关于</a>
        <a href="#field">方向</a>
        <a href="#projects">项目</a>
        <a href="#links">链接</a>
      </div>
      <div class="panel-inner">
        <section id="about">
          <h2>关于</h2>
          <p class="lead">在现象背后寻找结构，探索智能如何从简单中涌现。</p>
          <p class="now">Andy Chen，计算机科学学生，现居意大利特伦托（Trento）。</p>
        </section>

        <section id="field">
          <h2>方向</h2>
          <ul class="dir-list">
            <li>计算机科学</li>
            <li>人工智能</li>
            <li>复杂系统</li>
          </ul>
        </section>

        <section id="projects">
          <h2>项目</h2>
          <a class="proj" href="https://github.com/Andyccr/PhilosophicalCharacter" target="_blank" rel="noopener noreferrer">
            <span class="proj-name">PhilosophicalCharacter</span>
            <span class="proj-desc">NOEMA，中文哲学人格测评</span>
          </a>
          <a class="proj" href="https://github.com/Andyccr/YourEurMap" target="_blank" rel="noopener noreferrer">
            <span class="proj-name">YourEurMap</span>
            <span class="proj-desc">欧洲地图</span>
          </a>
          <a class="proj" href="https://github.com/Andyccr/TheMapGenerator" target="_blank" rel="noopener noreferrer">
            <span class="proj-name">TheMapGenerator</span>
            <span class="proj-desc">地图生成器</span>
          </a>
          <a class="proj" href="https://github.com/Andyccr/Hexwebmap" target="_blank" rel="noopener noreferrer">
            <span class="proj-name">Hexwebmap</span>
            <span class="proj-desc">六角格网页地图</span>
          </a>
          <a class="proj" href="https://github.com/Andyccr/GoodSouthweb" target="_blank" rel="noopener noreferrer">
            <span class="proj-name">GoodSouthweb</span>
            <span class="proj-desc">网页游戏</span>
          </a>
        </section>

        <section id="links">
          <h2>链接</h2>
          <p class="links">
            <a href="https://github.com/Andyccr" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://andyccr.github.io/wendao/" target="_blank" rel="noopener noreferrer">问道</a>
            <a href="https://andychen.net" target="_blank" rel="noopener noreferrer">旧博客</a>
          </p>
        </section>

        <a class="back" href="../">← 全部版本</a>
      </div>
    </div>
  </main>
</body>
</html>
